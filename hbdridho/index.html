<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Little Photo Book</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Instrument+Serif:ital@0;1&family=Karla:wght@400;600&display=swap">
<style>
/* Layout: a cloth-bound photo book on a confetti-strewn party table, bunting overhead, balloons drifting behind. Single light theme by choice: it's a birthday party. */
:root{
  --desk:#ffe2ec; --desk-2:#fff4f8; --desk-ink:#4a1f3a; --desk-soft:#8d5d77; --party-1:#e0557b; --party-2:#e8b04d; --party-3:#6aa9d8; --party-4:#8db59a; --party-5:#b48ad8;
  --paper:#fffaf7; --paper-edge:#efdcdc; --ink:#33202d; --ink-soft:#6f5664;
  --rose:#e0557b; --rose-soft:#f8cbd7; --gold:#e8b04d; --sage:#8db59a; --sky:#a9c8e6; --night:#25304e;
  --cloth:#7a2346; --cloth-2:#5e1a37; --foil:#f4cf86;
  --display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --hand:"Caveat", "Segoe Print", "Comic Sans MS", cursive;
  --body:"Karla", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
body{
  background-color:var(--desk);
  background-image:
    radial-gradient(circle at 20% 30%, var(--party-2) 0 2.5px, transparent 3px),
    radial-gradient(circle at 70% 60%, var(--party-3) 0 2.5px, transparent 3px),
    radial-gradient(circle at 45% 85%, var(--party-4) 0 2px, transparent 2.5px),
    radial-gradient(circle at 85% 15%, var(--party-5) 0 2.5px, transparent 3px),
    radial-gradient(circle at 10% 75%, var(--party-1) 0 2px, transparent 2.5px),
    radial-gradient(1200px 700px at 50% 0%, var(--desk-2), var(--desk));
  background-size:140px 140px,170px 170px,120px 120px,190px 190px,150px 150px,100% 100%;
  color:var(--desk-ink); font-family:var(--body); font-size:16px; line-height:1.6;
  min-height:100vh; overflow-x:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 40px;
}

/* lock */
.lock{max-width:460px;margin:70px auto 0;background:var(--rose);border-radius:10px;
  box-shadow:0 30px 50px -22px rgba(122,35,70,.55);padding:56px 32px 40px;text-align:center;position:relative;color:#fff;z-index:2;
  background-image:linear-gradient(90deg,transparent calc(50% - 16px),var(--foil) calc(50% - 16px),var(--foil) calc(50% + 16px),transparent calc(50% + 16px)),
    radial-gradient(circle,rgba(255,255,255,.18) 0 4px,transparent 5px);background-size:100% 100%,26px 26px}
.lock::before{content:"";position:absolute;left:-10px;right:-10px;top:-34px;height:46px;border-radius:8px;background:#c9416a;
  background-image:linear-gradient(90deg,transparent calc(50% - 16px),var(--foil) calc(50% - 16px),var(--foil) calc(50% + 16px),transparent calc(50% + 16px));box-shadow:0 6px 0 rgba(0,0,0,.08)}
.bow{position:absolute;left:50%;top:-86px;transform:translateX(-50%);width:120px;height:60px}
.lock-card{position:relative;background:var(--paper);color:var(--ink);border-radius:12px;padding:26px 22px 20px;box-shadow:0 10px 24px -12px rgba(60,20,40,.4)}
.lock h1{font-family:var(--display);font-weight:400;font-size:2.4rem;line-height:1.05;margin:0 0 6px;color:var(--ink)}
.lock h1 em{color:var(--rose)}
.lock p{font-family:var(--hand);font-size:1.4rem;margin:0 0 20px;color:var(--ink-soft)}
.lock form{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;position:relative}
.lock input{flex:1 1 180px;min-width:0;font:inherit;font-size:1rem;padding:12px 16px;border-radius:999px;border:1.5px solid var(--rose-soft);background:#fff;color:var(--ink)}
.lock input::placeholder{color:#b896a8}
.lock .err{font-family:var(--body);font-size:.9rem;color:var(--rose);min-height:1.4em;margin:12px 0 0}
.lock.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tag-line{font-weight:600;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rose);margin:0 0 6px}

/* bunting */
.bunting{position:relative;z-index:3;display:flex;justify-content:center;max-width:1000px;margin:0 auto 22px;padding-top:6px}
.bunting::before{content:"";position:absolute;left:0;right:0;top:6px;height:22px;border-top:2px solid var(--desk-soft);border-radius:0 0 50% 50%/0 0 100% 100%}
.flag{flex:1 1 0;max-width:58px;aspect-ratio:4/5;clip-path:polygon(0 0,100% 0,50% 100%);display:flex;justify-content:center;padding-top:.25em;line-height:1;
  font-family:var(--display);font-size:clamp(.8rem,2.6vw,1.45rem);color:#fff;transform-origin:top center;animation:flutter 3s ease-in-out infinite}
.flag.gap{background:none!important;max-width:24px}
.flag:nth-child(5n+1){background:var(--party-1)}.flag:nth-child(5n+2){background:var(--party-2)}.flag:nth-child(5n+3){background:var(--party-3)}.flag:nth-child(5n+4){background:var(--party-4)}.flag:nth-child(5n){background:var(--party-5)}
.flag:nth-child(odd){animation-delay:-1.5s}
@keyframes flutter{50%{transform:rotate(3deg)}}

/* balloons */
.balloons{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.balloon{position:absolute;bottom:0;width:58px;pointer-events:auto;cursor:pointer;animation:floatUp var(--d) linear infinite;animation-delay:var(--dl)}
.balloon svg{display:block;width:100%;height:auto;animation:sway 3.4s ease-in-out infinite alternate}
.balloon.popped{visibility:hidden}
@keyframes floatUp{from{transform:translateY(130px)}to{transform:translateY(calc(-100vh - 160px))}}
@keyframes sway{from{transform:rotate(-6deg) translateX(-6px)}to{transform:rotate(6deg) translateX(6px)}}
#lockWrap,#app{position:relative;z-index:1}
#lockWrap,#app{pointer-events:none}
#lockWrap>*,#app>*{pointer-events:auto}

.top{max-width:1000px;margin:0 auto 18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{font-family:var(--hand);font-weight:700;font-size:1.7rem;margin:0;color:var(--rose)}
.top p{margin:0;font-size:.85rem;color:var(--desk-soft);letter-spacing:.06em;text-transform:uppercase}

.book{max-width:1000px;margin:0 auto;position:relative;perspective:2200px;touch-action:pan-y}
.page{
  background:var(--paper); color:var(--ink); border-radius:6px 14px 14px 6px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.6), 0 0 0 1px var(--paper-edge), 6px 6px 0 -1px var(--paper-edge), 12px 12px 0 -2px #e6cfcf;
  display:grid; grid-template-columns:1fr 1fr; min-height:560px; position:relative; overflow:hidden;
  transform-origin:left center;
}
.page::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:60px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,rgba(80,40,60,.10) 45%,rgba(80,40,60,.18) 50%,rgba(80,40,60,.10) 55%,transparent);pointer-events:none}
.page.enter-next{animation:flipIn .7s cubic-bezier(.2,.7,.2,1)}
.page.enter-prev{animation:flipBack .7s cubic-bezier(.2,.7,.2,1)}
@keyframes flipIn{from{transform:rotateY(-28deg) translateX(30px);opacity:.3}to{transform:none;opacity:1}}
@keyframes flipBack{from{transform:rotateY(18deg) translateX(-30px);opacity:.3}to{transform:none;opacity:1}}

.side{padding:40px 44px;display:flex;flex-direction:column;justify-content:center;gap:18px;min-width:0}
.side.art{align-items:center}
.eyebrow{font-weight:600;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(2rem,4vw,2.9rem);line-height:1.05;margin:0;text-wrap:balance}
h2 em{color:var(--rose)}
.story{margin:0;max-width:40ch}
.note{font-family:var(--hand);font-size:1.35rem;color:var(--ink-soft);line-height:1.25;margin:0}

.polaroid{background:#fff;padding:12px 12px 0;box-shadow:0 14px 30px -12px rgba(60,20,40,.45);transform:rotate(-2.5deg);position:relative;width:100%;max-width:340px}
.polaroid.r{transform:rotate(2deg)}
.polaroid svg{display:block;width:100%;height:auto;border-radius:2px}
.polaroid img{display:block;width:100%;height:auto;cursor:zoom-in;border-radius:2px}
.side.art .polaroid.photo{max-width:270px}
.polaroid figcaption{font-family:var(--hand);font-size:1.3rem;color:var(--ink);text-align:center;padding:8px 6px 12px;line-height:1.15}
.tape{position:absolute;top:-12px;left:50%;width:90px;height:26px;transform:translateX(-50%) rotate(-4deg);background:rgba(232,176,77,.55);z-index:1}
.hint{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}

button{font:inherit;cursor:pointer}
.btn{background:var(--rose);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:600;box-shadow:0 6px 0 -1px #b23c5d;transition:transform .12s, box-shadow .12s;align-self:flex-start}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 -1px #b23c5d}
.btn.ghost{background:transparent;color:var(--rose);box-shadow:inset 0 0 0 2px var(--rose)}
.btn.foil{background:var(--foil);color:var(--cloth-2);box-shadow:0 6px 0 -1px #a97c2c;align-self:auto}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* cover */
.page.cover{grid-template-columns:1fr;color:#fbe6c9;background-color:var(--cloth);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px),linear-gradient(135deg,var(--cloth),var(--cloth-2))}
.page.cover::after{left:28px;width:14px;background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,255,255,.08),rgba(0,0,0,.2))}
.cover-inner{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:48px 24px}
.foil{font-family:var(--display);font-size:clamp(2.8rem,8vw,5.4rem);line-height:.95;margin:0;color:var(--foil);text-shadow:0 1px 0 #fff3d1,0 -1px 0 #9a6a1e;text-wrap:balance}
.foil em{display:block;font-size:.55em;transition:opacity .35s}
.foil em.fade{opacity:0}
.cover .frame{border:1.5px solid rgba(244,207,134,.6);padding:36px 30px;border-radius:4px;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative}
.cover .frame::before{content:"";position:absolute;inset:6px;border:1px solid rgba(244,207,134,.3);border-radius:2px;pointer-events:none}
.cover p{margin:0;font-family:var(--hand);font-size:1.5rem;color:#f8dcae}
.cover-balloons{position:absolute;top:22px;width:clamp(70px,14vw,130px);height:auto;pointer-events:none}
.cover-balloons.l{left:clamp(30px,6vw,70px)}
.cover-balloons.rt{right:clamp(14px,4vw,50px);transform:scaleX(-1)}
.cover-balloons g{animation:sway 3.6s ease-in-out infinite alternate;transform-origin:50% 100%;transform-box:fill-box}
.cover p.cover-small{font-family:var(--body);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(248,220,174,.75)}
.cover-inner{position:relative}
.ribbon{font-family:var(--body);font-weight:600;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cloth-2);background:var(--foil);padding:6px 18px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)}
.sparkles{display:flex;gap:10px;color:var(--foil);font-size:1rem;letter-spacing:.3em}
.cover .btn{align-self:center;background:var(--foil);color:var(--cloth-2);box-shadow:0 6px 0 -1px #a97c2c}

/* counter */
.counter{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:400px}
.counter div,.tally div{background:var(--rose-soft);border-radius:10px;padding:10px 4px;text-align:center}
.counter b,.tally b{display:block;font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.counter span,.tally span{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:400px}
.tally div{padding:14px 10px}
.tally b{font-size:2.8rem}

/* weekends */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:5px;max-width:420px}
.wk{aspect-ratio:1;border:0;border-radius:6px;background:#f6e6e6;color:var(--rose);font-size:15px;line-height:1;display:grid;place-items:center;padding:0;transition:transform .15s}
.wk.on{background:var(--rose-soft)}
.wk.on::before{content:"♥"}
.wk:not(.on)::before{content:"·";color:var(--ink-soft)}
.wk:hover{transform:scale(1.15)}
.wk.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.5)}}

/* photo wall */
.page.wall{grid-template-columns:1fr}
.page.wall::after{display:none}
.wall-in{justify-content:flex-start}
.wall-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.wall-head .eyebrow{flex-basis:100%}
.pins{display:grid;grid-template-columns:repeat(6,1fr);gap:26px 22px;align-items:start;padding-top:10px}
.pins .polaroid{transform:rotate(var(--r));max-width:none;grid-column:span 2;transition:transform .25s}
.pins .polaroid.wide{grid-column:span 4}
.pins .polaroid:hover{transform:rotate(0) scale(1.03);z-index:2}
.pins .polaroid:nth-child(3){grid-column:span 2}
.pins .polaroid:nth-child(4){grid-column:span 4}

/* names */
.nametag{width:100%;max-width:330px;height:auto}
#tagName{transition:opacity .25s}
.names{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-width:420px}
.names li{display:flex;align-items:baseline;gap:12px;padding:6px 12px;border-radius:10px;background:#fbeef0;opacity:.28;filter:blur(3px);transition:opacity .4s, filter .4s, background .4s}
.names li.shown{opacity:1;filter:none}
.names li.now{background:var(--rose-soft)}
.names span{font-size:.72rem;font-weight:600;letter-spacing:.08em;color:var(--rose);min-width:2em;font-variant-numeric:tabular-nums}
.names b{font-family:var(--hand);font-size:1.5rem;font-weight:700;line-height:1.1}
.names small{margin-left:auto;font-size:.75rem;color:var(--ink-soft)}

/* flip cards */
.cards{display:grid;gap:12px;max-width:420px}
.card{perspective:800px;border:0;background:none;padding:0;text-align:left;height:84px}
.card .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card.flipped .in{transform:rotateX(180deg)}
.card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 18px}
.card .f{background:#fbeef0;box-shadow:inset 0 0 0 1.5px var(--rose-soft)}
.card .f strong{font-family:var(--display);font-weight:400;font-size:1.55rem;color:var(--ink)}
.card .f small{margin-left:auto;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--rose)}
.card .b{background:var(--rose);color:#fff;transform:rotateX(180deg);font-family:var(--hand);font-size:1.3rem;line-height:1.15}

.phone{width:100%;max-width:300px;height:auto}

/* far but closest */
#farHim,#farHer{transition:transform .15s}
#farMeet{transition:opacity .3s;transform-origin:center;transform-box:fill-box}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:400px}
.clocks div{background:#fbeef0;border-radius:10px;padding:10px 12px}
.clocks span{display:block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.clocks b{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.closer{max-width:400px;display:grid;gap:4px}
.closer label{font-size:.75rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}
.closer input{width:100%;accent-color:var(--rose)}
.steps{display:flex;justify-content:space-between;font-family:var(--hand);font-size:1.15rem;color:var(--ink-soft)}
.km{margin:0;font-family:var(--display);font-size:1.6rem;color:var(--ink);font-variant-numeric:tabular-nums}

/* letter */
.envelope{border:0;background:none;padding:0;width:100%;max-width:340px}
.envelope svg{width:100%;height:auto;display:block;overflow:visible}
#flap{transform-origin:170px 80px;transition:transform .7s ease;transform-box:view-box}
.envelope.open #flap{transform:scaleY(-1)}
#letterSheet{transition:transform .8s .35s ease}
.envelope.open #letterSheet{transform:translateY(-70px)}
#seal{transition:opacity .3s}
.envelope.open #seal{opacity:0}
.letter{font-family:var(--hand);font-size:1.3rem;line-height:1.32;color:var(--ink);margin:0;max-width:46ch;
  background:repeating-linear-gradient(transparent 0 30px,rgba(224,85,123,.15) 30px 31px)}
.letter-wrap.sealed .letter{filter:blur(6px);user-select:none;opacity:.55}
.sign{font-family:var(--hand);font-size:1.6rem;color:var(--rose);margin:0}

/* cake */
.cake svg{width:100%;max-width:340px;height:auto;display:block;cursor:pointer}
.flame{transform-origin:center bottom;transform-box:fill-box;animation:flick .5s ease-in-out infinite alternate}
.flame.b{animation-delay:.2s}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.1) rotate(3deg)}}
.out .flame{opacity:0;transition:opacity .25s}
.smoke{opacity:0}
.out .smoke{animation:smoke 1.8s ease-out forwards}
@keyframes smoke{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.wish{font-family:var(--display);font-size:1.6rem;line-height:1.2;margin:0;color:var(--rose)}

.reason{font-family:var(--hand);font-size:1.55rem;line-height:1.2;min-height:2.6em;margin:0;color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.hearts-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.fh{position:absolute;color:var(--rose);font-size:22px;animation:rise 1.8s ease-out forwards;white-space:nowrap}
.fh.word{font-family:var(--hand);font-weight:700;color:var(--rose-soft);text-shadow:0 1px 0 var(--cloth-2)}
@keyframes rise{to{transform:translateY(-220px) scale(1.4);opacity:0}}

.lightbox{position:fixed;inset:0;z-index:70;background:rgba(30,15,26,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:82vh;border:10px solid #fff;border-bottom-width:34px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.lb-x{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:#e7cfda}

.twinkle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.beat{transform-origin:center;transform-box:fill-box;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.18)}40%{transform:scale(1)}60%{transform:scale(1.1)}}
.snow{animation:fall 6s linear infinite}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(200px)}}

nav.ctrl{max-width:1000px;margin:22px auto 0;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.nav-btn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--desk-soft);background:var(--paper);color:var(--desk-ink);font-size:1.2rem}
.nav-btn:disabled{opacity:.3;cursor:default}
.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.dot{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:#e8bccb}
.dot.on{background:var(--rose);transform:scale(1.25)}
.pg{font-family:var(--hand);font-size:1.2rem;color:var(--desk-soft);min-width:4.5em;text-align:center}
.snd{position:fixed;z-index:65;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));border:1.5px solid var(--desk-soft);background:var(--paper);color:var(--desk-ink);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.85rem;box-shadow:0 6px 16px -8px rgba(60,20,40,.4)}
.snd[aria-pressed="false"]{opacity:.7}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@media (max-width:760px){
  .cover-balloons{top:14px;width:64px}
  .cover-inner{padding-top:120px}
  .balloon{width:44px}
  .page{grid-template-columns:1fr;min-height:0}
  .page::after{display:none}
  .side{padding:28px 22px}
  .side.art{padding-bottom:4px}
  .counter b{font-size:1.5rem}
  .pins{grid-template-columns:1fr 1fr;gap:22px 16px}
  .pins .polaroid,.pins .polaroid:nth-child(3){grid-column:span 1}
  .pins .polaroid.wide,.pins .polaroid:nth-child(4){grid-column:span 2}
  .dots{display:none}
}
@media (prefers-reduced-motion:reduce){

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(VAULT.salt),iterations:VAULT.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(VAULT.iv)},key,b64(VAULT.ct));
  return new TextDecoder().decode(pt);
}
document.getElementById('lockForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const pw=document.getElementById('pw').value.trim().toLowerCase(),err=document.getElementById('err'),lock=document.getElementById('lock');
  if(!pw)return;
  Snd.init();err.textContent='unwrapping…';
  try{
    const html=await unlock(pw);
    const app=document.getElementById('app');app.innerHTML=html;app.hidden=false;
    document.getElementById('lockWrap').remove();
    initBook();Snd.unlock();
    setTimeout(()=>burst(innerWidth/2,innerHeight/3,90),250);
  }catch(x){
    err.textContent=window.crypto&&crypto.subtle?"That's not it. Try again.":"This browser can't open the book. Try Chrome or Safari.";
    Snd.wrong();lock.classList.remove('shake');void lock.offsetWidth;lock.classList.add('shake');
  }
});

/* sound */
const Snd=(()=>{
  let ctx=null,master=null,on=true,songBus=null;
  try{on=localStorage.getItem('snd')!=='off'}catch(_){}
  const mf=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.7;master.connect(ctx.destination)}catch(_){ctx=null}}
    if(ctx&&ctx.state==='suspended')ctx.resume();
  }
  const ok=()=>on&&ctx;
  function tone(f,t,d,o={}){
    const osc=ctx.createOscillator(),g=ctx.createGain();osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);
    if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(o.vol||.2,t+(o.a||.005));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    osc.connect(g);g.connect(o.bus||master);osc.start(t);osc.stop(t+d+.05);
  }
  let nbuf=null;
  function noise(t,d,o={}){
    if(!nbuf){nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const c=nbuf.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1}
    const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();src.buffer=nbuf;
    f.type=o.type||'bandpass';f.Q.value=o.q||1;f.frequency.setValueAtTime(o.f||1000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(o.vol||.3,t+(o.a||.005));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    src.connect(f);f.connect(g);g.connect(master);src.start(t);src.stop(t+d+.05);
  }
  function bell(m,t,d,vol,bus){const f=mf(m);tone(f,t,d,{vol,bus});tone(f*2,t,d*.6,{vol:vol*.35,bus});tone(f*3.01,t,d*.35,{vol:vol*.12,bus})}
  const fx={
    pop(){if(!ok())return;const t=ctx.currentTime;noise(t,.12,{f:1800,q:.7,vol:.55});tone(520,t,.12,{to:90,vol:.25,type:'triangle'})},
    flip(){if(!ok())return;const t=ctx.currentTime;noise(t,.28,{type:'highpass',f:900,f2:3500,vol:.12,a:.06})},
    tick(){if(!ok())return;tone(1320,ctx.currentTime,.12,{vol:.12})},
    chime(){if(!ok())return;const t=ctx.currentTime;[72,76,79,84].forEach((m,i)=>bell(m,t+i*.09,.9,.12))},
    love(){if(!ok())return;const t=ctx.currentTime;bell(79,t,.6,.14);bell(84,t+.1,.8,.14)},
    sparkle(){if(!ok())return;const t=ctx.currentTime;[88,91,96].forEach((m,i)=>bell(m,t+i*.05,.5,.06))},
    whoosh(){if(!ok())return;noise(ctx.currentTime,.7,{type:'lowpass',f:2500,f2:300,vol:.35,a:.08})},
    unlock(){if(!ok())return;const t=ctx.currentTime;noise(t,.35,{type:'highpass',f:1500,f2:5000,vol:.15,a:.02});[67,72,76,79,84].forEach((m,i)=>bell(m,t+.15+i*.08,1.1,.12))},
    wrong(){if(!ok())return;const t=ctx.currentTime;tone(196,t,.18,{type:'triangle',vol:.15});tone(165,t+.16,.25,{type:'triangle',vol:.15})},
    stopSong(){if(songBus){const b=songBus;b.gain.setTargetAtTime(0,ctx.currentTime,.08);setTimeout(()=>b.disconnect(),600);songBus=null}},
    song(){
      if(!ok())return;fx.stopSong();
      const bus=ctx.createGain();bus.gain.value=1;bus.connect(master);songBus=bus;
      const B=.43,t0=ctx.currentTime+.15;
      const mel=[[67,0,.75],[67,.75,.25],[69,1,1],[67,2,1],[72,3,1],[71,4,2],
        [67,6,.75],[67,6.75,.25],[69,7,1],[67,8,1],[74,9,1],[72,10,2],
        [67,12,.75],[67,12.75,.25],[79,13,1],[76,14,1],[72,15,1],[71,16,1],[69,17,1.5],
        [77,18.5,.75],[77,19.25,.25],[76,19.5,1],[72,20.5,1],[74,21.5,1],[72,22.5,3]];
      const C=[48,55,60,64],G7=[43,53,59,62],F=[41,53,57,60];
      const ch=[[C,1,3],[G7,4,3],[G7,7,3],[C,10,3],[C,13,3],[F,16,2.5],[C,19.5,2],[G7,21.5,1],[C,22.5,3]];
      mel.forEach(([m,b,d])=>bell(m,t0+b*B,Math.min(.5+d*B*1.6,2.4),.16,bus));
      ch.forEach(([n,b,d])=>{const t=t0+b*B;tone(mf(n[0]),t,d*B+.3,{type:'triangle',vol:.13,bus});
        n.slice(1).forEach((m,i)=>tone(mf(m),t+.03*i,d*B+.2,{type:'triangle',vol:.045,a:.02,bus}))});
      return (25.5*B+.4)*1000;
    }
  };
  return Object.assign({init,isOn:()=>on,set(v){on=v;try{localStorage.setItem('snd',v?'on':'off')}catch(_){}if(!v)fx.stopSong()}},fx);
})();
const sndBtn=document.getElementById('sndBtn');
function sndLabel(){sndBtn.textContent=Snd.isOn()?'♪ sound on':'♪ sound off';sndBtn.setAttribute('aria-pressed',Snd.isOn())}
sndLabel();sndBtn.onclick=()=>{Snd.init();Snd.set(!Snd.isOn());sndLabel();Snd.tick()};

/* floating hearts */
const layer=document.getElementById('hearts');
function floatHeart(x,y,txt){const h=document.createElement('span');h.className='fh'+(txt?' word':'');h.textContent=txt||'♥';
  h.style.left=(x-10+(Math.random()*20-10))+'px';h.style.top=(y-14)+'px';h.style.fontSize=(txt?22:16+Math.random()*14)+'px';
  layer.appendChild(h);setTimeout(()=>h.remove(),1800)}

/* confetti */
const cv=document.getElementById('fx'),cx=cv.getContext('2d');let parts=[],running=false;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
size();addEventListener('resize',size);
const cols=['#e0557b','#f8cbd7','#e8b04d','#8db59a','#a9c8e6','#fffaf7'];
function burst(x,y,n){if(reduce)n=Math.min(n,15);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*7;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length],h:Math.random()<.35,w:6+Math.random()*6,l:0})}
  if(!running){running=true;requestAnimationFrame(loop)}}
function heartPath(s){cx.beginPath();cx.moveTo(0,s*.3);cx.bezierCurveTo(0,0,-s*.5,0,-s*.5,s*.3);cx.bezierCurveTo(-s*.5,s*.6,0,s*.8,0,s);cx.bezierCurveTo(0,s*.8,s*.5,s*.6,s*.5,s*.3);cx.bezierCurveTo(s*.5,0,0,0,0,s*.3);cx.fill()}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.y<innerHeight+30&&p.l<260);
  for(const p of parts){p.vy+=.18;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
    if(p.h)heartPath(p.w*1.6);else cx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);cx.restore()}
  if(parts.length)requestAnimationFrame(loop);else running=false}

/* balloons */
const bWrap=document.getElementById('balloons');
const bCols=['#e0557b','#e8b04d','#6aa9d8','#8db59a','#b48ad8','#f28bb0'];
function balloonSVG(c){return '<svg viewBox="0 0 60 130"><path d="M30 76 q-7 14 3 26 q8 12 -3 26" stroke="#8d5d77" stroke-width="1.3" fill="none"/><path d="M25 70 L35 70 L30 77Z" fill="'+c+'"/><ellipse cx="30" cy="38" rx="25" ry="32" fill="'+c+'"/><ellipse cx="20" cy="25" rx="5" ry="10" fill="#fff" opacity=".4" transform="rotate(-22 20 25)"/></svg>'}
function makeBalloon(i){
  const b=document.createElement('div');b.className='balloon';b.innerHTML=balloonSVG(bCols[i%bCols.length]);
  b.style.left=(4+((i*37)%92))+'%';b.style.setProperty('--d',(14+(i*7)%10)+'s');b.style.setProperty('--dl',-((i*5.3)%18)+'s');
  b.addEventListener('pointerdown',()=>{if(b.classList.contains('popped'))return;const r=b.getBoundingClientRect();
    Snd.init();Snd.pop();burst(r.left+r.width/2,r.top+r.height*.3,35);b.classList.add('popped');
    setTimeout(()=>{b.classList.remove('popped');b.style.animation='none';void b.offsetWidth;b.style.animation=''},2600)});
  bWrap.appendChild(b)}
for(let i=0;i<(innerWidth<600?7:12);i++)makeBalloon(i);

function initBook(){
  const $=id=>document.getElementById(id);
  const pages=[...document.querySelectorAll('.page')],dotsEl=$('dots');let idx=0;
  $('pageCount').textContent='a photo book · '+(pages.length-1)+' pages';
  pages.forEach((p,i)=>{const d=document.createElement('button');d.className='dot';d.setAttribute('aria-label','Go to '+p.dataset.title);d.onclick=()=>go(i);dotsEl.appendChild(d)});
  function go(i){
    if(i<0||i>=pages.length||i===idx)return;
    const dir=i>idx?'enter-next':'enter-prev';
    pages[idx].hidden=true;const p=pages[i];p.hidden=false;
    p.classList.remove('enter-next','enter-prev');void p.offsetWidth;p.classList.add(dir);
    idx=i;sync();Snd.flip();window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
    if(i===pages.length-1)setTimeout(()=>burst(innerWidth/2,innerHeight/3,60),400);
  }
  function sync(){
    [...dotsEl.children].forEach((d,i)=>d.classList.toggle('on',i===idx));
    $('prev').disabled=idx===0;$('next').disabled=idx===pages.length-1;
    $('pg').textContent=idx===0?'cover':idx+' / '+(pages.length-1);
  }
  $('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);
  document.querySelectorAll('[data-go="next"]').forEach(b=>b.onclick=()=>go(idx+1));
  addEventListener('keydown',e=>{if(!$('lightbox').hidden){if(e.key==='Escape')$('lightbox').hidden=true;return}if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});
  let tx=null;const book=$('book');
  book.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  book.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)go(idx+(dx<0?1:-1));tx=null});
  sync();

  /* cover names */
  const nicks=[...document.querySelectorAll('#names li b')].slice(0,-1).map(b=>b.textContent).concat(['my love']);let ni=0;const cn=$('coverName');
  setInterval(()=>{if(reduce)return;cn.classList.add('fade');setTimeout(()=>{ni=(ni+1)%nicks.length;cn.textContent=nicks[ni];cn.classList.remove('fade')},350)},2200);

  /* lightbox */
  document.querySelectorAll('[data-zoom]').forEach(img=>img.onclick=()=>{$('lbImg').src=img.src;$('lbImg').alt=img.alt;$('lightbox').hidden=false});
  $('lightbox').onclick=()=>$('lightbox').hidden=true;

  /* shooting stars */
  const sky=$('nightSky'),shoot=$('shoot');
  sky.addEventListener('click',e=>{Snd.sparkle();
    const r=sky.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*300,y=(e.clientY-r.top)/r.height*240;
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('stroke','#fbe9c0');l.setAttribute('stroke-width','2.5');l.setAttribute('stroke-linecap','round');shoot.appendChild(l);let t=0;
    (function a(){t++;l.setAttribute('x1',x+t*3);l.setAttribute('y1',y+t*1.4);l.setAttribute('x2',x+t*4.6);l.setAttribute('y2',y+t*2.1);l.setAttribute('opacity',1-t/30);if(t<30)requestAnimationFrame(a);else l.remove()})();
  });

  /* counter */
  const start=new Date('2024-11-07T00:00:00');
  function tick(){let s=Math.max(0,Math.floor((Date.now()-start)/1000));
    const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);s%=60;
    $('cD').textContent=d.toLocaleString();$('cH').textContent=h;$('cM').textContent=m;$('cS').textContent=s}
  tick();setInterval(tick,1000);

  /* weekends */
  const weeks=$('weeks');let sat=new Date('2025-08-02T12:00:00');const now=new Date();let n=0;
  while(sat<=now){
    const b=document.createElement('button');b.className='wk';n++;if(n%7!==3)b.classList.add('on');
    b.setAttribute('aria-label','Weekend of '+sat.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}));
    b.onclick=()=>{Snd.tick();b.classList.add('on','pop');setTimeout(()=>b.classList.remove('pop'),400);
      const r=b.getBoundingClientRect();floatHeart(r.left+r.width/2,r.top);
      if(!weeks.querySelector('.wk:not(.on)')){$('weekNote').textContent="every single one. that's more like it.";burst(r.left,r.top,40)}};
    weeks.appendChild(b);sat=new Date(sat.getTime()+7*86400000);
  }

  /* nicknames */
  const lis=[...document.querySelectorAll('#names li')];let li=0;lis[0].classList.add('now');
  $('nameBtn').onclick=e=>{Snd.love();
    lis[li].classList.remove('now');li=(li+1)%lis.length;
    if(li===0)lis.forEach((x,i)=>x.classList.toggle('shown',i===0));
    lis[li].classList.add('shown','now');
    const t=$('tagName');t.style.opacity=0;
    setTimeout(()=>{t.textContent=li===lis.length-1?'all of them':lis[li].querySelector('b').textContent;t.style.opacity=1},200);
    $('nameBtn').textContent=li===lis.length-1?'Start over ↺':'Next name →';
    floatHeart(e.clientX,e.clientY);
    if(li===lis.length-1){const r=$('nameBtn').getBoundingClientRect();burst(r.left+r.width/2,r.top,40)}
  };

  /* cards */
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{Snd.flip();c.classList.toggle('flipped')});

  /* I love you */
  const BASE=parseInt($('chatCount').textContent,10);let love=BASE;try{love=Math.max(BASE,parseInt(localStorage.getItem('ily'),10)||BASE)}catch(_){}
  const words=['I love you','Main tumse pyaar karta hoon','Ich liebe dich','Je t\'aime','Te quiero','Ti amo','Ik hou van jou','愛してる','사랑해','Eu te amo'];
  const showLove=()=>{$('chatCount').textContent=love;$('loveNote').textContent=love===BASE?love+' and counting':love+' and counting. never stopping.'};
  showLove();
  $('loveBtn').onclick=e=>{Snd.love();love++;try{localStorage.setItem('ily',love)}catch(_){}showLove();
    const r=e.currentTarget.getBoundingClientRect();floatHeart(r.left+r.width/2-40,r.top,words[(love-BASE-1)%words.length]);
    for(let i=0;i<3;i++)setTimeout(()=>floatHeart(r.left+Math.random()*r.width,r.top),i*120);
    if(love%10===0)burst(r.left+r.width/2,r.top,50)};

  /* far but closest */
  const clks=[...document.querySelectorAll('.clk')];
  const clkTick=()=>clks.forEach(c=>{try{c.textContent=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',timeZone:c.dataset.tz}).format(new Date())}catch(_){}});
  clkTick();setInterval(clkTick,15000);
  const KM=parseInt($('kmOut').textContent.replace(/\D/g,''),10),sl=$('closeSlider');let met=false;
  sl.addEventListener('input',()=>{
    const v=+sl.value;
    $('farHim').setAttribute('transform','translate('+(v*.72)+' 0)');
    $('farHer').setAttribute('transform','translate('+(-v*.72)+' 0)');
    $('farMeet').style.opacity=v>=100?1:0;
    $('kmOut').textContent=v>=100?'0 km. closest.':Math.round(KM*(1-v/100)).toLocaleString()+' km';
    if(v>=100&&!met){met=true;Snd.chime();const r=sl.getBoundingClientRect();burst(r.left+r.width,r.top,70)}
    if(v<100)met=false;
  });

  /* envelope */
  const env=$('envelope');
  env.onclick=()=>{if(env.classList.contains('open'))return;env.classList.add('open');Snd.chime();$('envHint').textContent='for you, from me';
    setTimeout(()=>$('letterWrap').classList.remove('sealed'),600);
    const r=env.getBoundingClientRect();for(let i=0;i<8;i++)setTimeout(()=>floatHeart(r.left+r.width*(.3+Math.random()*.4),r.top+r.height*.4),i*90)};

  /* cake */
  const cake=$('cake');
  function blow(){if(cake.classList.contains('out'))return;cake.classList.add('out');Snd.init();Snd.whoosh();setTimeout(()=>Snd.song(),650);$('songBtn').hidden=false;
    $('wish').hidden=false;$('cakeHint').textContent='happy birthday ♥';$('blowBtn').textContent='Relight';
    const r=cake.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height*.2,140)}
  function relight(){Snd.stopSong();$('songBtn').hidden=true;cake.classList.remove('out');$('wish').hidden=true;$('blowBtn').textContent='Blow the candles';$('cakeHint').textContent='tap the cake to blow out the candles'}
  cake.onclick=blow;cake.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();blow()}};
  $('blowBtn').onclick=()=>cake.classList.contains('out')?relight():blow();
  $('songBtn').onclick=()=>{Snd.init();if(!Snd.isOn()){Snd.set(true);sndLabel()}Snd.song();const r=$('songBtn').getBoundingClientRect();burst(r.left+r.width/2,r.top,40)};

  /* reasons */
  const reasons=$('reasonList').innerHTML.split('|').map(s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value});
  let ri=0;$('reasonBtn').onclick=e=>{ri=(ri+1)%reasons.length;$('reason').textContent=reasons[ri];Snd.tick();floatHeart(e.clientX,e.clientY)};

  /* hug */
  const hug=$('hugBtn');let hugT=null,hugN=0;
  hug.addEventListener('pointerdown',e=>{e.preventDefault();hugN=0;hug.textContent='hugging…';clearInterval(hugT);
    hugT=setInterval(()=>{const r=hug.getBoundingClientRect();floatHeart(r.left+Math.random()*r.width,r.top);hugN++;
      if(hugN===14){Snd.chime();$('hugNote').textContent='Hug delivered. Collect the real one this weekend.';burst(r.left+r.width/2,r.top,50)}},90)});
  const hugEnd=()=>{clearInterval(hugT);hug.textContent='Hold for a hug'};
  ['pointerup','pointerleave','pointercancel'].forEach(t=>hug.addEventListener(t,hugEnd));
}
</script>
